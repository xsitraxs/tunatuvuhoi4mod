l_russian:

 TT_postwar_category: "Сибирь после договора"
 TT_postwar_council: "Созвать Сибирский совет"
 TT_postwar_council_desc: "Победа принесла земли, но не готовую систему управления. Представители армии, местных управ и Кызыла должны определить единственный курс. Выбор постоянный; проекты требуют мира и не дают национальных территорий."
 TT_postwar_ready_tt: "Независимая национальная Тува не капитулировала, находится в мире, получила дух победы и владеет всеми 14 базовыми регионами договора."
 TT_postwar_wait_tt: "После первого проекта прошло 30 игровых дней."
 TT_postwar_military_base: "Военная администрация"
 TT_postwar_military_base_desc: "Комендатуры подчиняют управление единой вертикали. Больше устойчивости, но распоряжения и проверки замедляют политическую работу."
 TT_postwar_military_settled: "Военная администрация — закреплённый курс"
 TT_postwar_military_settled_desc: "Комендатуры подчиняют управление единой вертикали. Больше устойчивости, но распоряжения и проверки замедляют политическую работу."
 TT_postwar_military_step1: "Сформировать окружные комендатуры"
 TT_postwar_military_step1_desc: "Первый проект выбранного курса. Даёт +2 процентных пункта стабильности один раз. Следующий этап откроется через 30 игровых дней; повторять этот проект нельзя."
 TT_postwar_military_step2: "Передать управление постоянным округам"
 TT_postwar_military_step2_desc: "Завершаем устройство новой администрации. Начальный дух выбранного курса заменяется закреплённым. Это не выдача национальных территорий: старые и новые владения сохраняют свой статус."
 TT_postwar_local_base: "Соглашение с местными элитами"
 TT_postwar_local_base_desc: "Старые управы помогают Кызылу проводить решения. Политическая работа идёт легче, но согласование интересов снижает военный промышленный выпуск."
 TT_postwar_local_settled: "Соглашение с местными элитами — закреплённый курс"
 TT_postwar_local_settled_desc: "Старые управы помогают Кызылу проводить решения. Политическая работа идёт легче, но согласование интересов снижает военный промышленный выпуск."
 TT_postwar_local_step1: "Заключить соглашения с городскими управами"
 TT_postwar_local_step1_desc: "Первый проект выбранного курса. Даёт +2 процентных пункта стабильности один раз. Следующий этап откроется через 30 игровых дней; повторять этот проект нельзя."
 TT_postwar_local_step2: "Учредить Сибирское представительство"
 TT_postwar_local_step2_desc: "Завершаем устройство новой администрации. Начальный дух выбранного курса заменяется закреплённым. Это не выдача национальных территорий: старые и новые владения сохраняют свой статус."
 TT_postwar_modern_base: "Имперское переустройство"
 TT_postwar_modern_base_desc: "Единые школы управления и строительные службы связывают новые владения с Кызылом. Наука и инфраструктура развиваются быстрее, но перемены вызывают недовольство."
 TT_postwar_modern_settled: "Имперское переустройство — закреплённый курс"
 TT_postwar_modern_settled_desc: "Единые школы управления и строительные службы связывают новые владения с Кызылом. Наука и инфраструктура развиваются быстрее, но перемены вызывают недовольство."
 TT_postwar_modern_step1: "Открыть школы сибирской администрации"
 TT_postwar_modern_step1_desc: "Первый проект выбранного курса. Даёт +2 процентных пункта стабильности один раз. Следующий этап откроется через 30 игровых дней; повторять этот проект нельзя."
 TT_postwar_modern_step2: "Ввести единые гражданские службы"
 TT_postwar_modern_step2_desc: "Завершаем устройство новой администрации. Начальный дух выбранного курса заменяется закреплённым. Это не выдача национальных территорий: старые и новые владения сохраняют свой статус."
 tt_postwar.1.t: "Сибирь наша. Что дальше?"
 tt_postwar.1.desc: "На столе перед делегатами лежат не карты наступления, а списки станций, складов и городских управ. Победа не ответила на вопрос, кто завтра выдаст жалованье железнодорожникам и чья печать будет стоять на распоряжениях.\n\nАрмия требует единой вертикали. Местные представители предлагают соглашение. Реформаторы хотят строить новое государство. Совет должен выбрать один курс — без возможности сменить его следующей кнопкой."
 tt_postwar.1.a: "Военная администрация."
 tt_postwar.1.b: "Соглашение с местными элитами."
 tt_postwar.1.c: "Имперское переустройство."
 tt_postwar.2.t: "После победы — порядок"
 tt_postwar.2.desc: "Новые распоряжения больше не приходится доставлять вслед уходящим штабам. У администрации появились постоянные адреса, ответственные люди и понятный порядок работы.\n\nВыбранный курс закреплён. Он не превратил завоевания в национальные территории, но дал государству инструменты для жизни после войны."
 tt_postwar.2.a: "Теперь нужно работать."
 tt_postwar.3.t: "Сибирское поражение"
 tt_postwar.3.desc: "На совещании в Москве требуют объяснить, как война с Тувой закончилась потерей стольких земель. Одни говорят о провале снабжения, другие — о политических просчётах.\n\nРасследование потребует политического капитала. Замолчать поражение дешевле, но это не вернёт уверенность обществу."
 tt_postwar.3.a: "Провести разбор ошибок."
 tt_postwar.3.b: "Не давать поражению новых заголовков."
 tt_postwar.4.t: "Новый вес Кызыла"
 tt_postwar.4.desc: "В Улан-Баторе изучают карту после Тайшетского договора. Сосед, которого прежде оценивали прежде всего через отношения с Москвой, теперь располагает огромными владениями.\n\nМожно отправить делегацию и искать рабочие отношения — либо ограничиться осторожным наблюдением. Ни один путь не требует новой войны."
 tt_postwar.4.a: "Отправить делегацию в Кызыл."
 tt_postwar.4.b: "Внимательно следить за новым соседом."
 tt_postwar.5.t: "Северный сосед изменился"
 tt_postwar.5.desc: "Донесение о Тайшетском договоре обсуждают в китайском правительстве. Возвышение Кызыла меняет обстановку к северу от наших границ, но само по себе не определяет будущих отношений.\n\nНужна ли дипломатическая миссия, чтобы выяснить намерения Тувы, или пока достаточно настороженного наблюдения?"
 tt_postwar.5.a: "Сохранять осторожность."
 tt_postwar.5.b: "Прояснить намерения через дипломатов."
 tt_postwar.6.t: "Депеши из соседних столиц"
 tt_postwar.6.desc: "На стол в Кызыле ложатся обзоры зарубежной прессы и дипломатические донесения. Договор заметили за пределами фронта: одни ищут объяснение поражению Москвы, другие пытаются понять намерения нового хозяина сибирских дорог.\n\nВнимание ещё не означает признания или дружбы. Наши соседи будут выбирать собственный тон. Теперь о Туве судят не только по тому, как она воюет, но и по тому, как управляет."
 tt_postwar.6.a: "Пусть увидят государство, а не только армию."
 TT_postwar_neighbour_dialogue: "Диалог после Тайшета"
 TT_postwar_neighbour_caution: "Настороженность после Тайшета"
