l_russian:

 TT_war_staff_maps: "Карты Генерального штаба"
 TT_war_staff_maps_desc: "Уточнить маршруты и подготовить штабные карты. Разовая награда: 10 опыта армии и 15 командного ресурса; на 180 дней — +3% максимального планирования. Не требуется для объявления войны."
 TT_war_border_depots: "Склады на северной границе"
 TT_war_border_depots_desc: "Собрать ограниченный резерв: 200 единиц базового пехотного и 20 вспомогательного снаряжения; на 180 дней — +2% защиты армии. Поставка разовая; новых заводов и постоянного снабжения нет."
 TT_war_field_reserve: "Армия для большой войны"
 TT_war_field_reserve_desc: "Подготовить небольшой обученный резерв: 500 людских ресурсов, 2 процентных пункта поддержки войны и на 180 дней +2% организации армии. Закон о призыве не меняется."
 TT_war_sayan_offensive: "Удар через Саяны"
 TT_war_sayan_offensive_desc: "Согласовать действия штабов. На 90 дней: +5% к максимальному планированию. Эффект прекращается раньше при окончании кампании."
 TT_war_siberian_guides: "Сибирские проводники"
 TT_war_siberian_guides_desc: "Местные проводники помогают подвозить припасы. На 90 дней: −3% расхода снабжения. Эффект прекращается раньше при окончании кампании."
 TT_war_transsib_advance: "К Транссибирской магистрали"
 TT_war_transsib_advance_desc: "На старте требуются контроль Тувы и восточных узлов (563, 564, 566), принадлежащих СССР. Награда: 10 опыта армии и 10 командного ресурса. Потеря узла не отменяет начатый фокус; окончание кампании отменяет."
 TT_war_red_army_salvage: "Трофеи Красной армии"
 TT_war_red_army_salvage_desc: "Для начала требуется контролировать советский Иркутск (566). Восстановить 150 базовых винтовок и 15 вспомогательного снаряжения. Потеря Иркутска не отменяет начатое восстановление; окончание кампании отменяет. Запасы СССР не списываются."
 TT_war_taishet_junction: "Тайшетский узел"
 TT_war_taishet_junction_desc: "Для начала требуются контроль Тувы и всех семи советских переговорных узлов. Награда: 20 политической власти и 10 опыта армии. Потеря узла не отменяет начатый фокус; окончание кампании отменяет. Для мира фокус не нужен и условие капитуляции в 10% не заменяет."
 TT_war_hold_conquests: "Закрепить завоевания"
 TT_war_hold_conquests_desc: "Укрепить управление растянувшимся фронтом. На 90 дней: +3% организации армии. Эффект прекращается раньше при окончании кампании."
 TT_war_new_siberian_border: "Новая граница Сибири"
 TT_war_new_siberian_border_desc: "Закрепить итоги успешного договора: 25 политической власти, 2 процентных пункта стабильности и 10 опыта армии. Требуются мир и все четырнадцать договорных регионов. Военные фокусы проходить необязательно; послевоенный совет доступен независимо."
 TT_war_staff_plan: "Штабной план наступления"
 TT_war_staff_plan_desc: "Максимальное планирование: +5%. Не более 90 дней и только пока активна кампания против СССР."
 TT_war_guides: "Сеть сибирских проводников"
 TT_war_guides_desc: "Расход снабжения: −3%. Не более 90 дней и только пока активна кампания против СССР."
 TT_war_front_cohesion: "Управление сибирским фронтом"
 TT_war_front_cohesion_desc: "Организация армии: +3%. Не более 90 дней и только пока активна кампания против СССР."
 TT_war_preparation_staff: "Штабная подготовка"
 TT_war_preparation_staff_desc: "На 180 дней: +3% максимального планирования."
 TT_war_preparation_depots: "Пограничные укрепления"
 TT_war_preparation_depots_desc: "На 180 дней: +2% защиты армии."
 TT_war_preparation_reserve: "Подготовленный резерв"
 TT_war_preparation_reserve_desc: "На 180 дней: +2% организации армии."
 TT_war_preparation_tt: "Независимая Тува на национальном пути, без капитуляции и без победного духа; СССР существует и не состоит с нами в одном альянсе."
 TT_war_campaign_tt: "Активна кампания против СССР: завершён «Сибирский гамбит», обе стороны продолжают сопротивление, победный дух ещё не получен."
