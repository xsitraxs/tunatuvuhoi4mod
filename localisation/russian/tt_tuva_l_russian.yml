l_russian:

 # ================================================================
 #  ФОКУСЫ
 # ================================================================

 TT_center_of_asia: "Центр Азии"
 TT_center_of_asia_desc: "Обелиск в Кызыле отмечает географический центр Азии. Веками тувинцы жили на перекрёстке империй. Пора напомнить миру: центр Азии — это не место, через которое проходят, а народ, с которым считаются."

 TT_the_great_khural: "Великий Хурал"
 TT_the_great_khural_desc: "Великий Хурал — собрание всех родов и кожуунов — не созывался десятилетиями. Делегаты со всей степи съезжаются в Кызыл, чтобы решить судьбу республики."

 TT_red_yurt: "Красная юрта"
 TT_red_yurt_desc: "Москва предлагает сталь, станки и советников. Взамен Тува встанет рядом с Советским Союзом в надвигающейся буре. Красная юрта тепла, и огонь в ней яркий."

 TT_the_soviet_arsenal: "Арсенал Сибири"
 TT_the_soviet_arsenal_desc: "На берегу Енисея поднимется современный оружейный завод: советские станки, советские инженеры и тувинские руки."

 TT_the_siberian_military_district: "Сибирский военный округ"
 TT_the_siberian_military_district_desc: "Тува становится южным щитом Сибири. Нашу армию обучат, вооружат и вымуштруют по советским уставам."

 TT_the_red_banner_over_asia: "Красное знамя над Азией"
 TT_the_red_banner_over_asia_desc: "Революция не останавливается у Саян. От маньчжурских равнин до тихоокеанского побережья будет реять красное знамя."

 # ================================================================
 #  ФИНАЛЬНЫЕ ФОКУСЫ СОВЕТСКОЙ ВЕТВИ
 # ================================================================

 TT_form_central_asian_ssr: "Образовать Среднеазиатскую ССР"
 TT_form_central_asian_ssr_desc: "Кызыл предлагает Москве смелую перестройку советского Востока: республики Средней Азии от Каспия до Тянь-Шаня объединяются в одну союзную республику под знаменем Центра Азии. Слово за Москвой."
 TT_the_battle_for_manchuria: "Битва за Маньчжурию"
 TT_the_battle_for_manchuria_desc: "Красное знамя не останавливается у Амура. Гирин, Жэхэ и Ляодун объявлены нашей целью; претензии к Маньчжоу-го — или его японским хозяевам — открывают дорогу к Тихому океану."

 TT_tuvan_renaissance: "Тувинское возрождение"
 TT_tuvan_renaissance_desc: "Хватит быть сноской в московских книгах. Тувинский язык, тувинские песни, тувинская история — и тувинские заводы за тувинское золото. Народ просыпается и больше не желает быть марионеткой."

 TT_the_second_khanate: "Второе ханство"
 TT_the_second_khanate_desc: "Потомков старых ханов зовут домой из изгнания. Народ требует хана, и Кызыл отвечает. Второе Тувинское ханство провозглашено."

 TT_the_great_khan: "Великий хан"
 TT_the_great_khan_desc: "Степь помнит Чингисхана. От Алтая до Гоби племена смотрят на Кызыл. Великий хан — не воспоминание, а обещание."

 TT_the_empire_of_the_steppe: "Империя Степи"
 TT_the_empire_of_the_steppe_desc: "Не ханство и не республика — империя. Империя Степи простёрлась от Енисея до Тихого океана, и мир это заметил."

 TT_first_five_year_plan: "Первая пятилетка"
 TT_first_five_year_plan_desc: "Пять лет, пять заводов, одна цель: вытащить Туву из века юрты в век машины."

 TT_collective_herds: "Коллективные стада"
 TT_collective_herds_desc: "Стада степи принадлежат народу. Коллективные хозяйства накормят рабочих и освободят аратов для заводов и армии."

 TT_kyzyl_industries: "Кызыльские заводы"
 TT_kyzyl_industries_desc: "У Кызыла появится собственный промышленный пояс: текстильная фабрика, кирпичный завод, оружейный цех. Город обелиска станет городом дымящих труб."

 TT_mineral_prospecting: "Разведка недр"
 TT_mineral_prospecting_desc: "Геологи докладывают о хроме, угле и железе в тувинских холмах. Советские изыскания не ошибались: степь богата."

 TT_the_kyzyl_railroad: "Кызыльская железная дорога"
 TT_the_kyzyl_railroad_desc: "Дорога от Абакана до Кызыла свяжет Туву с Транссибом. Стальные рельсы прочнее любого договора."

 TT_the_yenisei_dam: "Енисейская ГЭС"
 TT_the_yenisei_dam_desc: "Енисей — великая река Сибири. Плотина у Кызыла осветит юрты и даст ток заводам на сто лет вперёд."

 TT_the_golden_hoard: "Золотая казна"
 TT_the_golden_hoard_desc: "Сокровищницу старых ханов так и не нашли. Теперь тувинское золото наполняет государственный банк, а золото покупает ружья, заводы и друзей."

 TT_the_ground_forces: "Сухопутные войска Тувы"
 TT_the_ground_forces_desc: "Наследница народно-революционной армии 1921 года: современные сухопутные войска. Училища, штабы, дисциплина."

 TT_cavalry_of_the_steppe: "Степная кавалерия"
 TT_cavalry_of_the_steppe_desc: "Конь — душа степи. Тувинская конница пройдёт там, куда не проедет грузовик."

 TT_soviet_advisors: "Советские советники"
 TT_soviet_advisors_desc: "Советские офицеры научат наших командиров искусству современной войны — от обороны саянских перевалов до глубокой операции."

 TT_mountain_warfare: "Горная война"
 TT_mountain_warfare_desc: "Тува — страна гор и лесов. Наши солдаты будут сражаться там, где кончаются дороги."

 TT_the_tuvan_air_force: "Тувинские ВВС"
 TT_the_tuvan_air_force_desc: "Горстка «Поликарповых» и грунтовая полоса у Кызыла — начало тувинских военно-воздушных сил. Небо принадлежит смелым."

 TT_total_mobilization: "Всеобщая мобилизация"
 TT_total_mobilization_desc: "Каждый арат — солдат, каждая юрта — казарма. Республика мобилизуется к грядущей войне."

 TT_claims_on_the_steppe: "Претензии на степь"
 TT_claims_on_the_steppe_desc: "Тувинцы живут по обе стороны Саян. Алтай, Хакасия, Монголия — древние тувинские земли, разорванные империями."

 TT_the_mongolian_question: "Монгольский вопрос"
 TT_the_mongolian_question_desc: "Монголия слаба и разрывается между Москвой и Токио. Курултай степи решит: братство или завоевание."

 TT_greater_tuva: "Великая Тува"
 TT_greater_tuva_desc: "Великая Тува от Алтая до Байкала: земли тюркских и монгольских народов. Государство, достойное своего имени."

 TT_the_siberian_gambit: "Сибирская авантюра"
 TT_the_siberian_gambit_desc: "Сибирь должна стать частью нашего государства. Нам больше не нужно ждать чужой войны: момент для выступления против Москвы выберем мы сами."

 # ================================================================
 #  ВОЕННЫЕ ФОКУСЫ 1.1.0: ДОКТРИНЫ, ВВС, ВМФ
 # ================================================================

 TT_infantry_and_artillery: "Пехота и артиллерия"
 TT_infantry_and_artillery_desc: "Не конём единым воюет степь. Дисциплинированная пехота и батареи полевых орудий удержат Саяны и сомнут врага огневым валом."
 TT_tanks_of_the_steppe: "Танки степи"
 TT_tanks_of_the_steppe_desc: "Стальные кони нового века. Бронетанковый кулак пройдёт по степи быстрее любой конницы — если хватит горючего, механиков и дерзости."
 TT_wings_of_the_steppe: "Крылья степи"
 TT_wings_of_the_steppe_desc: "Штурмовики над Саянами: наша авиация учится поддерживать войска с воздуха, а не только красоваться на парадах в Кызыле."
 TT_bombers_over_siberia: "Бомбардировщики Сибири"
 TT_bombers_over_siberia_desc: "Средние бомбардировщики с тувинскими опознавательными знаками способны достать до любого узла Транссиба. Небо Сибири больше не безопасно."
 TT_the_yenisei_flotilla: "Енисейская флотилия"
 TT_the_yenisei_flotilla_desc: "У Тувы нет моря, но есть великая река. Вооружённые пароходы и канонерки Енисея — первый шаг к настоящему флоту."
 TT_kyzyl_naval_school: "Морская школа Кызыла"
 TT_kyzyl_naval_school_desc: "Штурманы, механики и артиллеристы флота готовятся в самом центре Азии — за тысячи километров от ближайшего океана. Степь умеет ждать."
 TT_the_pacific_fleet: "Тихоокеанский флот степи"
 TT_the_pacific_fleet_desc: "Ляодун в наших руках, а значит, у Тувы есть выход к океану. Верфи Порт-Артура заложат корабли под флагом степи."

 # ================================================================
 #  НАЦИОНАЛЬНЫЕ ДУХИ
 # ================================================================

 TT_center_of_asia_spirit: "Центр Азии"
 TT_center_of_asia_spirit_desc: "Кызыл — центр Азии, и его народ это знает."

 TT_soviet_friendship: "Дружба с Москвой"
 TT_soviet_friendship_desc: "Советские советники, советские машины, советская дружба."

 TT_national_awakening: "Национальное пробуждение"
 TT_national_awakening_desc: "Народ вспоминает, кто он."

 TT_khanate: "Второе Тувинское ханство"
 TT_khanate_desc: "Хан вернулся в Кызыл — и степь строит свои заводы."

 TT_great_khan: "Наследие Великого хана"
 TT_great_khan_desc: "Племена степи отвечают на зов и строят свою державу."

 TT_steppe_empire: "Империя Степи"
 TT_steppe_empire_desc: "Империя, выкованная в седле и стали."

 TT_red_banner: "Красное знамя над Азией"
 TT_red_banner_desc: "Революция идёт на восток."

 TT_siberian_district: "Сибирский военный округ"
 TT_siberian_district_desc: "Южный щит Сибири."

 TT_siberian_gambit: "Сибирская авантюра"
 TT_siberian_gambit_desc: "Мы сами выбираем момент для похода в Сибирь."

 TT_planned_economy: "Плановая экономика"
 TT_planned_economy_desc: "Пятилетки по-тувински."

 TT_collective_farms: "Коллективные стада"
 TT_collective_farms_desc: "Стада принадлежат народу."

 TT_kyzyl_railway: "Кызыльская железная дорога"
 TT_kyzyl_railway_desc: "Стальные рельсы связывают степь с миром."

 TT_yenisei_dam: "Енисейская ГЭС"
 TT_yenisei_dam_desc: "Великая река даёт силу республике."

 TT_gold_reserve: "Золотая казна"
 TT_gold_reserve_desc: "Золото в подвалах государственного банка."

 TT_steppe_claims: "Претензии на степь"
 TT_steppe_claims_desc: "Старые границы — оскорбление для степи."

 TT_ground_forces: "Сухопутные войска"
 TT_ground_forces_desc: "Единые, профессиональные сухопутные войска Тувы."

 TT_steppe_cavalry: "Степная кавалерия"
 TT_steppe_cavalry_desc: "Конь — душа степи."

 TT_soviet_military_mission: "Советская военная миссия"
 TT_soviet_military_mission_desc: "Искусство современной войны от Красной Армии."

 TT_mountain_troops: "Горные стрелки"
 TT_mountain_troops_desc: "Хозяева саянских перевалов."

 TT_mobilization: "Всеобщая мобилизация"
 TT_mobilization_desc: "Каждый арат — солдат."

 TT_firepower_doctrine: "Огневая доктрина"
 TT_firepower_doctrine_desc: "Пехота держит фронт, артиллерия решает исход боя."
 TT_armored_fist: "Бронетанковый кулак"
 TT_armored_fist_desc: "Танки и мотопехота прорывают фронт там, где конница не пройдёт."
 TT_steppe_aviation: "Авиация степи"
 TT_steppe_aviation_desc: "Пилоты степи учатся воевать в небе."
 TT_siberian_bombers: "Бомбардировщики Сибири"
 TT_siberian_bombers_desc: "Гул моторов над Транссибом слышен от Кызыла до океана."
 TT_river_flotilla: "Енисейская флотилия"
 TT_river_flotilla_desc: "Канонерки великой реки — школа будущих адмиралов степи."
 TT_pacific_ambition: "Тихоокеанские амбиции"
 TT_pacific_ambition_desc: "Флаг степи над океаном: верфи работают день и ночь."

 # ================================================================
 #  СРЕДНЕАЗИАТСКАЯ ССР / МАНЬЧЖУРСКАЯ КАМПАНИЯ
 # ================================================================

 TT_central_asian_ssr_spirit: "Среднеазиатская ССР"
 TT_central_asian_ssr_spirit_desc: "От Арала до Тянь-Шаня республики Средней Азии теперь смотрят на Кызыл. Заводы, лаборатории и партийные школы работают на весь союз."
 TT_manchurian_campaign: "Маньчжурская кампания"
 TT_manchurian_campaign_desc: "Наши армии идут на восток. Каждая винтовка и каждый конь нужны в грядущей борьбе за Маньчжурию."
 TT_masters_of_manchuria: "Хозяева Маньчжурии"
 TT_masters_of_manchuria_desc: "Гирин, Жэхэ и Ляодун наши. Промышленность Маньчжурии отныне работает на Центр Азии."

 # ================================================================
 #  РЕШЕНИЯ
 # ================================================================

 TT_tuva_category: "Тувинские дела"

 TT_convene_the_khural: "Созвать Великий Хурал"
 TT_convene_the_khural_desc: "Собрать делегатов степи в Кызыле и дать им слово от имени народа."

 TT_mobilize_the_arats: "Мобилизовать аратов"
 TT_mobilize_the_arats_desc: "Призвать пастухов под знамёна. Степь может выделить несколько тысяч всадников."

 TT_gold_expedition: "Золотая экспедиция"
 TT_gold_expedition_desc: "Отправить старателей в тувинские холмы на поиски сокровищницы старых ханов."

 TT_radio_broadcast: "Горловое пение в эфире"
 TT_radio_broadcast_desc: "Транслировать хоомей по всей республике и за её пределами. Голос степи — само по себе оружие."

 TT_request_soviet_aid: "Запросить советскую помощь"
 TT_request_soviet_aid_desc: "Попросить у Москвы винтовки, пулемёты и советников. Друзья помогают друзьям."

 # ================================================================
 #  МАНЬЧЖУРСКИЕ РЕШЕНИЯ
 # ================================================================

 TT_launch_manchurian_offensive: "Начать маньчжурское наступление"
 TT_launch_manchurian_offensive_desc: "Бросить армию в полномасштабное наступление в Маньчжурии на полгода: бонусы к атаке, организации и планированию, а затем — заслуженный запас армейского опыта."
 TT_proclaim_manchurian_victory: "Провозгласить победу в Маньчжурии"
 TT_proclaim_manchurian_victory_desc: "Когда Гирин, Жэхэ и Ляодун окажутся в наших руках, можно провозгласить победу, включить завоёванные земли в состав страны и заменить дух кампании постоянным."
 TT_develop_industrial_zones: "Развивать промышленные зоны"
 TT_develop_industrial_zones_desc: "Выделить землю и коммуникации под новые заводы у Кызыла: +§Y1§! место под строительство в Туве. Решение можно повторять каждые 90 дней."
 TT_rally_the_clans: "Присяга кожуунов"
 TT_rally_the_clans_desc: "Собрать старейшин родов и принять от них присягу хану: поддержка нейтралитета вырастет, а коммунистам станет не до заговоров."

 # ================================================================
 #  СОБЫТИЯ
 # ================================================================

 tt_tuva.1.t: "Центр Азии"
 tt_tuva.1.desc: "На берегу Енисея, там, где обелиск Кызыла отмечает центр Азии, солнце встаёт над юртами. Танну-Тува мала, бедна и забыта миром. Но степь помнит. Народ помнит.\n\nНачинается новая глава."
 tt_tuva.1.a: "Степь проснётся."
 tt_tuva.1.b: "Пусть решает народ."

 tt_tuva.2.t: "Голос Москвы"
 tt_tuva.2.desc: "Из Москвы приходит телеграмма. В Кремле узнали о Великом Хурале и недовольны. Туве напоминают о её месте в советской семье и о судьбе малых народов, забывающих друзей."
 tt_tuva.2.a: "Мы не будем злить Москву."
 tt_tuva.2.b: "Тува сама решит свою судьбу."

 tt_tuva.3.t: "Провозглашено ханство"
 tt_tuva.3.desc: "В Кызыле перед собравшимися делегатами степи поднято знамя Второго Тувинского ханства. Старых ханов помнят, нового — называют. Москва молчит. Мир — нет."
 tt_tuva.3.a: "Новый хан восходит."

 tt_tuva.4.t: "Империя Степи"
 tt_tuva.4.desc: "От Енисея до Тихого океана всадники Тувы идут под новым знаменем. Империя Степи провозглашена, и канцелярии мира спешно пытаются понять, что произошло в самом сердце Азии."
 tt_tuva.4.a: "У степи есть император."

 tt_tuva.5.t: "Золото Тувы"
 tt_tuva.5.desc: "Экспедиция возвращается из холмов с обозами золота и серебра. Сокровищница старых ханов больше не легенда. Вопрос лишь в том, что с ней делать."
 tt_tuva.5.a: "Вложить в промышленность."
 tt_tuva.5.b: "Отдать народу."

 tt_tuva.6.t: "Степь затаила дыхание"
 tt_tuva.6.desc: "Тува не скрывает своих замыслов. В Улан-Баторе монгольские князья взвешивают варианты. В Токио и Москве перекраивают карты. Степь затаила дыхание."
 tt_tuva.6.a: "Пусть смотрят."

 tt_tuva.7.t: "Тувинский ультиматум"
 tt_tuva.7.desc: "Тувинское посольство прибывает в Улан-Батор с простым требованием: Монголия должна войти во Второе Тувинское ханство. Послы не скрывают альтернативы — тувинская конница уже сосредотачивается на границе. Курултай ждёт ответа."
 tt_tuva.7.a: "Принять ультиматум."
 tt_tuva.7.b: "Отклонить ультиматум."

 tt_tuva.8.t: "Монголия входит в ханство"
 tt_tuva.8.desc: "Монголия приняла тувинский ультиматум. Знамена Второго ханства подняты над Улан-Батором, и степь объединена под властью Кызыла."
 tt_tuva.8.a: "Степь едина."

 tt_tuva.9.t: "Монголия отвергает ультиматум"
 tt_tuva.9.desc: "Улан-Батор отверг тувинское требование. Монголия выходит из Коминтерна, а тувинская армия готовится взять степь силой."
 tt_tuva.9.a: "Война в степи."

