 TT_naval_doctrine_boost: "Исследования морской доктрины"
 TT_war_declaration_tt: "Снимает порог §Yмирового напряжения§! для обоснования целей войны"
 TT_requires_liaotung: "Мы контролируем Ляодун (выход к морю)"
 TT_pacific_fleet_tt: "Если мы контролируем §YЛяодун§!, там будут построены §Y2 верфи§!."
 TT_masters_of_siberia: "Покорители Севера"
 TT_masters_of_siberia_desc: "Ключевые узлы Сибири заняты. По Тайшетскому договору Москва признала передачу четырнадцати договорных регионов и других советских регионов под нашим контролем."
 TT_dictate_peace_in_siberia: "Принудить Москву к Тайшетскому миру"
 TT_dictate_peace_in_siberia_desc: "Требование мира доступно при 10% прогресса капитуляции СССР и контроле Тувы и семи сибирских узлов. Решение о восточном рейде необязательно; этапов и 30-дневного счётчика больше нет. Контроль Якутска исключает отказ советского ИИ. После настоящего отказа повторный запрос доступен через 90 дней."
 TT_siberian_gambit_decision_tt: "Открывает Тайшетский мир: 10% прогресса капитуляции СССР и контроль Тувы, Читы, Бурятии, Иркутска, Красноярска, Кемерова, Новосибирска и Томска. Без обязательных подготовительных решений и таймера. Уступка — 14 договорных регионов плюс остальные советские регионы под контролем Тувы на момент согласия Москвы."
 TT_dictate_peace_in_siberia_tt: "Требуем Алтай, Ойратский регион, Читу, Бурятию, Бодайбо, Иркутск, Братск, Красноярск, Кемерово, Новосибирск, Якутск, Киренск, Енисейск и Томск. Сверх этого пакета передаются другие регионы, принадлежащие СССР и контролируемые Тувой на момент согласия Москвы. Оккупации союзников и владения третьих стран не передаются. Национальные территории не добавляются. Ожидаем ответа Москвы."

 TT_proclaim_siberian_victory: "Провозгласить сибирскую победу"
 TT_proclaim_siberian_victory_desc: "Война с СССР завершилась без Тайшетского договора, а четырнадцать согласованных сибирских регионов в наших руках. Провозгласите победу, чтобы открыть Сибирский совет и решить судьбу новых земель."
 TT_proclaim_siberian_victory_tt: "Выдаётся дух §YМастера Сибири§! и открывается послевоенная глава — те же награды, что и по Тайшетскому договору, без требования в ходе войны."
 TT_taishet_victory_package_tt: "Все четырнадцать согласованных сибирских регионов (Алтай, Ойратский, Чита, Бурятия, Бодайбо, Иркутск, Братск, Красноярск, Кемерово, Новосибирск, Якутск, Киренск, Енисейск, Томск) должны принадлежать Туве."

 TT_central_asian_ssr_tt: "Если §YСССР§! существует и мы не воюем с ним, Москву попросят передать нам среднеазиатские республики."
 TT_manchurian_offensive_tt: "Создаёт цели войны за §YГирин, Жэхэ и Ляодун§! и открывает решение §Y«Начать маньчжурское наступление»§!."

 tt_tuva.10.t: "Депеша из Кызыла"
 tt_tuva.10.desc: "На кремлёвский стол легла карта сибирских железных дорог. Семь узлов находятся в руках тувинских войск; донесения с востока говорят о растянутых коммуникациях и нехватке резервов.\n\nКызыл предлагает закончить войну ценой передачи четырнадцати договорных регионов — от Алтая до Забайкалья и Якутии — и других советских регионов под контролем Тувы. Представители Тувы называют это Тайшетским договором. Для Москвы это выбор между тяжёлой уступкой и продолжением войны."
 tt_tuva.10.a: "Подписать договор. Сохранить то, что осталось."
 tt_tuva.10.b: "Переговоры окончены. Продолжать войну."
 tt_tuva.11.t: "Тайшетский договор"
 tt_tuva.11.desc: "Из Сибири пришло сообщение о прекращении войны между СССР и Тувой. После боёв за узлы Транссибирской магистрали Москва согласилась на территориальные уступки.\n\nПод власть Кызыла переходят четырнадцать договорных регионов, включая земли Алтая, Забайкалья и Якутии, а также другие занятые Тувой советские регионы. Новый договор меняет равновесие сил в Азии: небольшая степная республика стала обладательницей огромных сибирских пространств."
 tt_tuva.11.a: "На карте Азии появились новые границы."

 # ================================================================
 #  СОБЫТИЯ: СРЕДНЕАЗИАТСКАЯ ССР И МАНЬЧЖУРИЯ
 # ================================================================

 tt_tuva.12.t: "Кызыльская инициатива"
 tt_tuva.12.desc: "Делегация из Кызыла прибыла в Кремль с необычным предложением: объединить советские республики Средней Азии в единую Среднеазиатскую ССР, связанную с Тувой. Сторонники обещают порядок, хлеб и лояльный Восток, противники называют это расчленением Союза. Решение за Москвой."
 tt_tuva.12.a: "Одобрить. Передать союзные республики Кызылу."
 tt_tuva.12.b: "Отказать. Границы остаются прежними."
 tt_tuva.13.t: "Москва одобрила Среднеазиатскую ССР"
 tt_tuva.13.desc: "Кремль подписал декрет. От Каспия до Тянь-Шаня двадцать один штат переходит под управление Кызыла: рождается новая Среднеазиатская ССР, и карта советского Востока перекраивается без единого выстрела."
 tt_tuva.13.a: "На карте появляется новая республика."
 tt_tuva.14.t: "Москва отказалась передавать республики"
 tt_tuva.14.desc: "После долгих споров в Кремле предложение Кызыла отклонено. Среднеазиатские союзные республики остаются в составе СССР, как и прежде; Тува получает лишь скромную компенсацию политической властью за свою инициативу."
 tt_tuva.14.a: "Карта остаётся прежней."
 tt_tuva.15.t: "Началась битва за Маньчжурию"
 tt_tuva.15.desc: "Центр Азии заявил права на Гирин, Жэхэ и Ляодун. Колонны тувинских войск движутся на восток, и Маньчжоу-го с Японией получили предупреждение: борьба за Маньчжурию началась."
 tt_tuva.15.a: "Знамёна поворачивают на восток."
 tt_tuva.16.t: "Победа в Маньчжурии"
 tt_tuva.16.desc: "Гирин, Жэхэ и Ляодун пали. Маньчжурская кампания завершена: завоёванные земли входят в состав государства, армия получает новый постоянный дух, и мир теперь говорит о Туве как о тихоокеанской державе."
 tt_tuva.16.a: "От Кызыла до Тихого океана."

 # Legacy CAS research compensation
 TT_cas_research_boost: "Исследование штурмовой авиации"

 TT_request_siberian_corridor: "Запросить сибирский коридор"
 TT_request_siberian_corridor_desc: "Попросить Москву передать Ойратский регион, чтобы у Тувы и Среднеазиатской ССР появилась непрерывная сухопутная граница. Одного Семипалатинска недостаточно, пока между нами лежит советский Алтай."
 TT_request_siberian_corridor_tt: "Отправляет дипломатический запрос §YСССР§!. При согласии передаётся только §YОйратский регион (654)§! — §Yбез национальных территорий§!. Отказ не блокирует кампанию; повторить запрос можно через §Y180§! дней."
 tt_tuva.17.t: "Сибирский коридор"
 tt_tuva.17.desc: "Кызыл просит узкий сухопутный мост через Ойратский регион. Без него новая Среднеазиатская ССР остаётся отрезанной от Тувы советской Сибирью. На карте просьба скромная, но снова меняет внутренние границы Союза."
 tt_tuva.17.a: "Дать коридор. Передать Ойратский регион."
 tt_tuva.17.b: "Отказать. Сибирь остаётся неделимой."
 tt_tuva.18.t: "Москва открыла сибирский коридор"
 tt_tuva.18.desc: "Кремль одобрил передачу Ойратского региона Кызылу. Там, где советский Алтай отделял Туву от Семипалатинска, теперь лежит непрерывный сухопутный путь от Центра Азии к её среднеазиатской республике."
 tt_tuva.18.a: "Степь наконец соединена."
 tt_tuva.19.t: "Москва сохранила алтайский мост"
 tt_tuva.19.desc: "Москва отказалась уступить Ойратский регион. Среднеазиатская ССР по-прежнему отделена от Тувы советской территорией; Кызыл сможет повторить просьбу позже, но пока карта остаётся разорванной надвое."
 tt_tuva.19.a: "Спросим снова, когда придёт время."

 TT_corridor_not_granted_tt: "Сибирский коридор ещё не получен"
 TT_corridor_soviet_path_tt: "Выбран советский политический путь"
 TT_corridor_no_pending_tt: "Нет запроса коридора, ожидающего ответа Москвы"
 TT_corridor_no_refusal_cooldown_tt: "Нет недавнего отказа Москвы (после отказа должно пройти 180 дней)"

 TT_request_war_mandate: "Согласовать самостоятельные военные действия"
 TT_request_war_mandate_desc: "Для наступления в Маньчжурии недостаточно цели войны: правила альянса ограничивают малые державы. Попросим Москву разрешить самостоятельное объявление войн всем независимым участникам нашего альянса. Тува останется в альянсе."
 TT_request_war_mandate_tt: "Отправляет запрос §YСССР§!. При согласии правило объявления войн меняется для §Yвсего альянса§!: объявлять войны смогут независимые участники, а не только крупные державы. Война §Yне начинается автоматически§!; цели войны и остальные дипломатические ограничения сохраняются. После отказа повторный запрос доступен через §Y180 дней§!."
 TT_requires_soviet_path_tt: "Выбран советский политический путь"
 TT_mandate_not_granted_tt: "Москва ещё не одобрила изменение правила по этому запросу"
 TT_mandate_no_pending_tt: "Нет запроса о военных действиях, ожидающего ответа Москвы"
 TT_mandate_no_refusal_tt: "После предыдущего отказа прошло 180 дней либо отказа ещё не было"
 tt_tuva.20.t: "Кызыл просит военную самостоятельность"
 tt_tuva.20.desc: "Тува готовит маньчжурскую кампанию, но не может объявить войну из-за правил нашего альянса. Кызыл предлагает разрешить самостоятельное объявление войн всем независимым участникам. Это изменение общей политики, а не исключение для одной страны. Оно не начинает войну и не отменяет другие дипломатические ограничения."
 tt_tuva.20.a: "Разрешить независимым участникам объявлять войны."
 tt_tuva.20.b: "Сохранить действующие правила."
 tt_tuva.21.t: "Москва пересматривает военную политику альянса"
 tt_tuva.21.desc: "После обращения Кызыла Москва разрешила независимым участникам своего альянса самостоятельно объявлять войны. Тува сохраняет союз с СССР, но больше не ограничена требованием статуса крупной державы. Решение о начале маньчжурской кампании остаётся за её руководством."
 tt_tuva.21.a: "Самостоятельность без разрыва союза."
 tt_tuva.22.t: "Москва отклоняет предложение Кызыла"
 tt_tuva.22.desc: "Москва отказалась менять правила объявления войн в альянсе. Кызыл сможет повторить запрос через 180 дней. Тува остаётся участником альянса; полученные цели войны сами по себе не отменяют его ограничений."
 tt_tuva.22.a: "Вернёмся к переговорам позднее."

 TT_secure_eastern_transsib: "Перерезать восточный Транссиб"

 TT_secure_eastern_transsib_desc: "Необязательный однократный рейд: удерживая Туву, занять Бурятию, Иркутск и Читу. За 25 политической власти получаем 25 армейского опыта. СССР на 180 дней получает +10% к атаке и +15% к защите только против Тувы. Решение не требуется для Тайшетского мира и повторно не используется."



 TT_siberian_counteroffensive: "Сибирский контрудар"

 TT_siberian_counteroffensive_desc: "Москва стягивает резервы для восстановления связи по Транссибу. Бонусы действуют только против Тувы и исчезают после мира либо через 180 дней."

 TT_taishet_campaign_ready_tt: "Выбран национальный путь и завершена Сибирская авантюра. Тува и СССР существуют, воюют друг с другом и не капитулировали. Тайшетский мир ещё не заключён."

 tt_tuva.23.t: "Магистраль разорвана"

 tt_tuva.23.desc: "На восточных участках Транссиба замолкли советские диспетчерские. Наши командиры возвращаются из рейда с картами, донесениями и новым опытом. Но тишина на линии не означает, что Москва смирилась с потерей магистрали.\n\nСоветское командование перебрасывает резервы. На 180 дней его войска получают +10% к атаке и +15% к защите против Тувы."

 tt_tuva.23.a: "Теперь они знают, где нас искать."

 TT_eastern_transsib_ready_tt: "Идёт война национальной Тувы с некапитулировавшим СССР. Мы контролируем Туву, Читу, Бурятию и Иркутск. Этот однократный рейд ещё не проведён; он не является условием мира."
 TT_taishet_no_pending_tt: "Нет запроса о Тайшетском мире, ожидающего ответа Москвы."
 TT_taishet_no_cooldown_tt: "Нет действующего 90-дневного ограничения после отказа Москвы."

 TT_taishet_package_uncontested_tt: "Все 14 регионов договора принадлежат и подконтрольны только СССР или Туве — без владельцев и оккупаций третьих стран."

 tt_tuva.24.t: "Над Ангарой — новое знамя"

 tt_tuva.24.desc: "В Кызыл доставили донесение из Иркутска. Над городом поднято наше знамя; патрули занимают вокзал, склады и подходы к переправам. На улицах ещё слышны выстрелы, а жители осторожно выходят к закрытым лавкам.\n\nДля командования это не конец кампании, а новый рубеж. Пока на западе продолжается война, удержать железную дорогу будет не легче, чем взять её."

 tt_tuva.24.a: "Удержать город. Сберечь магистраль."

 tt_tuva.25.t: "Делегация на Тайшет"

 tt_tuva.25.desc: "В дорогу отправились дипломаты и офицеры с картами, на которых отмечены условия будущего мира. Они должны добиться признания наших завоеваний и положить конец войне с Москвой.\n\nПока советская сторона изучает предложение, на фронте сохраняются прежние приказы. Отправка делегации не означает перемирия. Ответ ещё не получен."

 tt_tuva.25.a: "До ответа — оставаться на позициях."

 tt_tuva.26.t: "Подписи под новой границей"

 tt_tuva.26.desc: "Последние возражения остались позади. На столе лежат подписанные экземпляры Тайшетского договора, а связисты передают приказ о прекращении войны. В Кызыле встречают весть о мире — с облегчением и недоверием к масштабу перемен.\n\nЧетырнадцать оговорённых регионов и другие советские регионы под нашим контролем перешли под нашу власть. Теперь предстоит то, чего нельзя добиться кавалерийской атакой: наладить управление, снабжение и жизнь людей по обе стороны бывшего фронта."

 tt_tuva.26.a: "Война окончена. Начинается другая работа."

 tt_tuva.27.t: "Москва сказала «нет»"

 tt_tuva.27.desc: "Советская делегация отказалась подписывать предложенный договор. Карты убраны со стола, переговорщики готовятся к отъезду. Москва рассчитывает вернуть потерянные узлы силой.\n\nВойна продолжается. Новое обращение можно будет направить через 90 дней; до тех пор судьба магистрали решается на фронте."

 tt_tuva.27.a: "Значит, ответ придётся написать на фронте."

 tt_tuva.28.t: "Провокация на восточной границе"

 tt_tuva.28.desc: "Советский патруль перешёл линию границы и обстрелял наш пограничный пост. В Москве уверенно заявляют, что «инцидента не было».\n\nСтавка сделана на нашу сдержанность: жёсткий ответ может разогреть и без того горячую границу."

 tt_tuva.28.a: "Сдержаться. Пусть инцидент решают дипломаты."

 tt_tuva.28.b: "Ответить жёстко."

 TT_pressure_border_risk_tt: "Риск: 55% — народ сплотится (+3% поддержки войны); 45% — власти выглядят слабо (-3% стабильности)."

 tt_tuva.29.t: "Ультиматум Москвы"

 tt_tuva.29.desc: "Москва требует свернуть военные приготовления и отвести войска от восточной границы. Срок ультиматума — две недели.\n\nВыполнение обесценит всё, чего мы уже добились; отказ грозит открытой эскалацией."

 tt_tuva.29.a: "Уступить требованиям."

 tt_tuva.29.b: "Отвергнуть ультиматум."

 TT_pressure_ultimatum_risk_tt: "Риск: 50% — народ сплотился (+5% поддержки войны, +50 политической власти); 50% — элита в панике (-5% стабильности, -25 политической власти)."

 tt_tuva.30.t: "Сеть НКВД"

 tt_tuva.30.desc: "В Кызыле вскрыта агентурная сеть: радиопередатчики, шифры, списки офицеров. Москва официально «не имеет к этому отношения».\n\nСкандал можно замять — или превратить в показательный процесс."

 tt_tuva.30.a: "Тихо выдворить агентов."

 tt_tuva.30.b: "Устроить публичный процесс."

 TT_pressure_nkvd_risk_tt: "Риск: 55% — процесс поднял дух нации (+4% поддержки войны, +25 политической власти); 45% — «охота на шпионов» пугает общество (-4% стабильности)."

