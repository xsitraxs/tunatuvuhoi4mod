l_russian:

 TT_khozhuun_category: "Управление кожуунами"

 TT_khozhuun_restore_administration: "Восстановить местную администрацию"

 TT_khozhuun_restore_administration_desc: "За годы смуты управление в кожуунах обветшало: писари разбежались, печати потеряны, распоряжения Кызыла доходят до стойбищ с опозданием. Соберём управы заново, вернём на места старост и наладим учёт."

 TT_khozhuun_train_officials: "Подготовить местных управленцев"

 TT_khozhuun_train_officials_desc: "Кто-то должен вести книги, считать скот и делить пастбища. Откроем курсы в Кызыле для будущих управленцев из кожуунов."

 TT_khozhuun_link_khozhuuns: "Поддержать сообщение между кожуунами"

 TT_khozhuun_link_khozhuuns_desc: "Между кожуунами нет надёжных дорог и связи: зимой гонцы и обозы застревают в снегах. Устроим почтово-транспортную службу и наладим путь вдоль Енисея и трактов."

 TT_khozhuun_officials_cadre: "Местные управленцы"

 TT_khozhuun_officials_cadre_desc: "Кожууны дали республике грамотных писарей, счетоводов и распорядителей. Дела идут быстрее, а наука приживается прочнее."

 TT_khozhuun_transport_service: "Кожуунная почта и тракты"

 TT_khozhuun_transport_service_desc: "Почтово-транспортная служба связала стойбища с Кызылом. Дороги, мосты и зимники теперь строятся быстрее."
