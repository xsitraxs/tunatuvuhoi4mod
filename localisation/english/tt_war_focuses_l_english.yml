l_english:

 TT_war_staff_maps: "General Staff Maps"
 TT_war_staff_maps_desc: "Survey routes and prepare staff maps. One-time reward: 10 army experience and 15 command power; +3% maximum planning for 180 days. Not required to declare war."
 TT_war_border_depots: "Northern Border Depots"
 TT_war_border_depots_desc: "Assemble a limited reserve: 200 basic infantry equipment and 20 support equipment; +2% army defence for 180 days. One delivery only; no factories or permanent supply bonus."
 TT_war_field_reserve: "An Army for a Major War"
 TT_war_field_reserve_desc: "Prepare a small trained reserve: 500 manpower, two percentage points of war support and +2% army organization for 180 days. Does not change conscription laws."
 TT_war_sayan_offensive: "The Sayan Offensive"
 TT_war_sayan_offensive_desc: "Coordinate headquarters. For 90 days: +5% maximum planning. Ends early when the campaign is no longer active."
 TT_war_siberian_guides: "Siberian Guides"
 TT_war_siberian_guides_desc: "Local guides help deliver supplies. For 90 days: -3% supply consumption. Ends early when the campaign is no longer active."
 TT_war_transsib_advance: "Towards the Trans-Siberian Railway"
 TT_war_transsib_advance_desc: "At selection, control Tuva and eastern nodes (563, 564, 566) owned by the USSR. Reward: 10 army experience and 10 command power. Losing a node does not cancel the running focus; ending the campaign does."
 TT_war_red_army_salvage: "Red Army Salvage"
 TT_war_red_army_salvage_desc: "To start, control Soviet-owned Irkutsk (566). Refurbish 150 basic infantry equipment and 15 support equipment. Losing Irkutsk does not cancel work already underway; ending the campaign does. Soviet stockpiles are not deducted."
 TT_war_taishet_junction: "The Taishet Junction"
 TT_war_taishet_junction_desc: "To start, control Tuva and all seven Soviet-owned negotiation nodes. Reward: 20 political power and 10 army experience. Losing a node does not cancel the running focus; ending the campaign does. Not required for peace; does not replace the 10% surrender-progress condition."
 TT_war_hold_conquests: "Secure the Gains"
 TT_war_hold_conquests_desc: "Improve command across an extended front. For 90 days: +3% army organization. Ends early when the campaign is no longer active."
 TT_war_new_siberian_border: "The New Siberian Border"
 TT_war_new_siberian_border_desc: "Consolidate a successful treaty: 25 political power, two percentage points of stability and 10 army experience. Requires peace and all fourteen treaty states. Wartime focuses are optional; the postwar council is independently available."
 TT_war_staff_plan: "Staff Offensive Plan"
 TT_war_staff_plan_desc: "Maximum planning: +5%. Up to 90 days, only while the Soviet campaign is active."
 TT_war_guides: "Siberian Guide Network"
 TT_war_guides_desc: "Supply consumption: -3%. Up to 90 days, only while the Soviet campaign is active."
 TT_war_front_cohesion: "Siberian Front Coordination"
 TT_war_front_cohesion_desc: "Army organization: +3%. Up to 90 days, only while the Soviet campaign is active."
 TT_war_preparation_staff: "Staff Preparation"
 TT_war_preparation_staff_desc: "+3% maximum planning for 180 days."
 TT_war_preparation_depots: "Border Fortifications"
 TT_war_preparation_depots_desc: "+2% army defence for 180 days."
 TT_war_preparation_reserve: "Prepared Reserve"
 TT_war_preparation_reserve_desc: "+2% army organization for 180 days."
 TT_war_preparation_tt: "Independent national-path Tuva has not capitulated or received the victory spirit; the USSR exists and is not in our faction."
 TT_war_campaign_tt: "The Soviet campaign is active: the Siberian Gambit is completed, neither side has capitulated, and the victory spirit has not been received."
