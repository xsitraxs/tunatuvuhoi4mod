 TT_tuvan_empire_DEF: "the Tuvan Empire"
 TT_tuvan_empire_ADJ: "Tuvan"

 TT_central_asian_ssr: "Central Asian SSR"
 TT_central_asian_ssr_DEF: "the Central Asian SSR"
 TT_central_asian_ssr_ADJ: "Central Asian"

 TT_khan_leader_name: "Aldyn-ool Khan"
 TT_khan_leader_desc: "A descendant of the old khans, raised in Kyzyl and sworn to restore the empire of the steppe."
 TT_requires_national_path: "The Tuvan national path is chosen"
 TT_requires_left_comintern: "Tuva has left the Comintern"

 TT_industry_boost: "Industrial Research"
 TT_industry_boost_2: "Industrial Research"
 TT_land_doctrine_boost: "Land Doctrine Research"
 TT_infantry_boost: "Infantry Research"
 TT_artillery_boost: "Artillery Research"
 TT_armor_boost: "Armour Research"
 TT_air_doctrine_boost: "Air Doctrine Research"
 TT_naval_doctrine_boost: "Naval Doctrine Research"
 TT_war_declaration_tt: "The Khanate spirit removes the §YWorld Tension§! threshold for justifying war goals: the Khan may declare wars at any time, including against the §YSoviet Union§!."
 TT_requires_liaotung: "We control Liaotung (access to the sea)"
 TT_pacific_fleet_tt: "If we control §YLiaotung§!, §Y2 dockyards§! will be built there."
 TT_masters_of_siberia: "Masters of the North"
 TT_masters_of_siberia_desc: "The Trans-Siberian Railway is severed and the Red Army garrisons beyond the Urals have capitulated. Siberia now belongs to the steppe."
 TT_dictate_peace_in_siberia: "Dictate the Taishet Peace"
 TT_dictate_peace_in_siberia_desc: "By seizing Irkutsk, Chita, Krasnoyarsk and Novosibirsk, we have severed the Trans-Siberian Railway. The Kremlin will have no choice but to recognize Kyzyl's rule over Siberia."
 TT_siberian_gambit_decision_tt: "Unlocks the §YDictate the Taishet Peace§! decision, allowing us to sign a separate peace and annex Siberia once key cities are captured."
 TT_dictate_peace_in_siberia_tt: "We will demand that the §YSoviet Union§! formally cede Southern and Eastern Siberia and sign a peace treaty."

 TT_central_asian_ssr_tt: "If §Ythe Soviet Union§! exists and we are not at war with it, Moscow will be asked to transfer the Central Asian republics to us."
 TT_manchurian_offensive_tt: "Creates a wargoal for §YKirin, Jehol and Liaotung§! and unlocks the §YManchurian Offensive§! decision."

 tt_tuva.10.t: "The Taishet Ultimatum"
 tt_tuva.10.desc: "Tuvan forces have seized the vital hubs of the Trans-Siberian Railway — from Chita and Irkutsk to Krasnoyarsk and Novosibirsk. Contact with the Far East is lost, and reinforcing the east is impossible. Envoys from Kyzyl offer an armistice at Taishet in exchange for ceding Siberia."
 tt_tuva.10.a: "Cede Siberia to save the motherland."
 tt_tuva.10.b: "Not one step back! We will retake Siberia!"
 tt_tuva.11.t: "The Peace of Taishet"
 tt_tuva.11.desc: "Astonishing news arrives from Siberia: following the fall of Novosibirsk, Krasnoyarsk and Irkutsk, the Soviet government has signed a separate peace treaty with Tuva. Vast territories from the Altai to Transbaikalia have formally passed under Kyzyl's control."
 tt_tuva.11.a: "Siberia bows to the horsemen of the steppe."

 # ================================================================
 #  EVENTS: CENTRAL ASIAN SSR AND MANCHURIA
 # ================================================================

 tt_tuva.12.t: "The Kyzyl Initiative"
 tt_tuva.12.desc: "A delegation from Kyzyl has arrived in the Kremlin with an extraordinary proposal: unite the Soviet republics of Central Asia into a single Central Asian SSR, tied to Tuva. Its supporters promise order, grain and a loyal east; its opponents call it the dismemberment of the Union. The decision belongs to Moscow."
 tt_tuva.12.a: "Approve. Transfer the union republics to Kyzyl."
 tt_tuva.12.b: "Refuse. The borders stay as they are."
 tt_tuva.13.t: "Moscow Approves the Central Asian SSR"
 tt_tuva.13.desc: "The Kremlin has signed the decree. From the Caspian to the Tien Shan twenty-one states pass under the administration of Kyzyl: a new Central Asian SSR is born, and the map of the Soviet east is redrawn without a single shot being fired."
 tt_tuva.13.a: "A new republic takes its place on the map."
 tt_tuva.14.t: "Moscow Refuses the Transfer"
 tt_tuva.14.desc: "After long debates in the Kremlin the proposal from Kyzyl has been declined. The Central Asian union republics remain within the Soviet Union as before; Tuva receives only a modest compensation in political capital for its initiative."
 tt_tuva.14.a: "The map stays the way it was."
 tt_tuva.15.t: "The Battle for Manchuria Begins"
 tt_tuva.15.desc: "The Center of Asia has claimed Kirin, Jehol and Liaotung. Columns of Tuvan troops are moving east, and both Manchukuo and Japan have been put on notice: the struggle for Manchuria has begun."
 tt_tuva.15.a: "The banners turn to the east."
 tt_tuva.16.t: "Victory in Manchuria"
 tt_tuva.16.desc: "Kirin, Jehol and Liaotung have fallen. The Manchurian campaign is over: the conquered lands are integrated into the state, the army gains a lasting new spirit, and the world now speaks of Tuva as a Pacific power."
 tt_tuva.16.a: "From Kyzyl to the Pacific."

