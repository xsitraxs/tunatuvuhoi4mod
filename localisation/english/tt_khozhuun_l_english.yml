l_english:

 TT_khozhuun_category: "Khozhuun Administration"

 TT_khozhuun_restore_administration: "Restore the Local Administration"

 TT_khozhuun_restore_administration_desc: "Years of unrest have left the khozhuuns' administration in disrepair: clerks have scattered, seals are lost, and Kyzyl's orders reach the camps late. Let us rebuild the offices, restore the elders, and set the registers straight."

 TT_khozhuun_train_officials: "Train Local Officials"

 TT_khozhuun_train_officials_desc: "Someone must keep the books, count the herds, and divide the pastures. We will open courses in Kyzyl for future officials drawn from the khozhuuns."

 TT_khozhuun_link_khozhuuns: "Support Links Between the Khozhuuns"

 TT_khozhuun_link_khozhuuns_desc: "The khozhuuns lack reliable roads and communications: in winter couriers and convoys bog down in the snow. We will set up a postal and transport service and improve routes along the Yenisei and the highways."

 TT_khozhuun_officials_cadre: "Local Officials"

 TT_khozhuun_officials_cadre_desc: "The khozhuuns have given the republic literate clerks, accountants and administrators. Business runs faster and learning takes hold more firmly."

 TT_khozhuun_transport_service: "Khozhuun Post and Roads"

 TT_khozhuun_transport_service_desc: "A postal and transport service now links the camps to Kyzyl. Roads, bridges and winter tracks are quicker to build."
