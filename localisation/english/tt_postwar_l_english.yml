 TT_postwar_local_step1_desc: "The first project of the chosen course grants two percentage points of stability once. The next stage unlocks after thirty game days; this project cannot be repeated."
 TT_postwar_local_step2: "Establish a Siberian Representative Council"
 TT_postwar_local_step2_desc: "Complete the new administration. Replace the initial course spirit with its consolidated version. No cores are granted; old and new possessions retain their existing status."
 TT_postwar_modern_base: "Imperial Reconstruction"
 TT_postwar_modern_base_desc: "Shared administrative schools and construction services link the new lands to Kyzyl. Research and infrastructure improve, but disruption reduces stability."
 TT_postwar_modern_settled: "Imperial Reconstruction — Consolidated"
 TT_postwar_modern_settled_desc: "Shared administrative schools and construction services link the new lands to Kyzyl. Research and infrastructure improve, but disruption reduces stability."
