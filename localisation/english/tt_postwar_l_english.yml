 TT_postwar_category: "Siberia after the Treaty"
 TT_postwar_council: "Convene the Siberian Council"
 TT_postwar_council_desc: "Victory brought territory, not a functioning administration. Army officers, local councils and Kyzyl must agree on one permanent course. Projects require peace and do not grant cores."
 TT_postwar_ready_tt: "Independent national-path Tuva is at peace, has not capitulated, has the victory spirit and owns all fourteen base treaty states."
 TT_postwar_wait_tt: "Thirty game days have passed since the first project."
 TT_postwar_military_base: "Military Administration"
 TT_postwar_military_base_desc: "Commandant offices establish a single chain of authority. Stability improves, but orders and inspections slow political work."
 TT_postwar_military_settled: "Military Administration — Consolidated"
 TT_postwar_military_settled_desc: "Commandant offices establish a single chain of authority. Stability improves, but orders and inspections slow political work."
 TT_postwar_military_step1: "Establish District Commandant Offices"
 TT_postwar_military_step1_desc: "The first project of the chosen course grants two percentage points of stability once. The next stage unlocks after thirty game days; this project cannot be repeated."
 TT_postwar_military_step2: "Establish Permanent Administrative Districts"
 TT_postwar_military_step2_desc: "Complete the new administration. Replace the initial course spirit with its consolidated version. No cores are granted; old and new possessions retain their existing status."
 TT_postwar_local_base: "Accord with Local Elites"
 TT_postwar_local_base_desc: "Existing councils help Kyzyl implement policy. Political work becomes easier, but negotiated compromises reduce military factory output."
 TT_postwar_local_settled: "Accord with Local Elites — Consolidated"
