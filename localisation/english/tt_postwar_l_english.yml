 tt_postwar.1.t: "Siberia Is Ours. What Comes Next?"
 tt_postwar.1.desc: "The delegates face lists of stations, warehouses and municipal councils instead of offensive maps. Victory has not decided who will pay the railway workers tomorrow or whose seal will authorise an order.\n\nThe army demands a single chain of command. Local representatives propose an accord. Reformers want a new administrative state. The council must choose one course, not a policy to replace at the next click."
 tt_postwar.1.a: "Military Administration."
 tt_postwar.1.b: "Accord with Local Elites."
 tt_postwar.1.c: "Imperial Reconstruction."
 tt_postwar.2.t: "Order after Victory"
 tt_postwar.2.desc: "Orders no longer have to chase departing headquarters. The administration now has permanent offices, responsible officials and a workable routine.\n\nOur chosen course is consolidated. It has not turned conquered lands into cores, but it has given the state tools for life after the war."
 tt_postwar.2.a: "Now the work begins."
 tt_postwar.3.t: "The Siberian Defeat"
 tt_postwar.3.desc: "A meeting in Moscow demands an explanation for the loss of so much territory to Tuva. Some blame failed logistics, others political misjudgement.\n\nAn inquiry will cost political capital. Silence is cheaper, but will not restore public confidence."
 tt_postwar.3.a: "Investigate the failures."
 tt_postwar.3.b: "Keep the defeat out of the headlines."
 tt_postwar.4.t: "Kyzyl’s New Weight"
 tt_postwar.4.desc: "Ulaanbaatar studies the map after the Taishet Treaty. A neighbour once viewed chiefly through its relationship with Moscow now holds vast territories.\n\nWe can send a delegation to seek a working relationship, or observe cautiously. Neither course requires another war."
 tt_postwar.4.a: "Send a delegation to Kyzyl."
 tt_postwar.4.b: "Watch our strengthened neighbour carefully."
 tt_postwar.5.t: "A Changed Northern Neighbour"
 tt_postwar.5.desc: "The Chinese government considers reports of the Taishet Treaty. Kyzyl’s rise changes the situation to our north, but does not determine our future relations.\n\nShould a diplomatic mission explore Tuvan intentions, or is cautious observation enough for now?"
 tt_postwar.5.a: "Remain cautious."
 tt_postwar.5.b: "Clarify their intentions through diplomacy."
 tt_postwar.6.t: "Dispatches from Neighbouring Capitals"
 tt_postwar.6.desc: "Press summaries and diplomatic reports arrive in Kyzyl. The treaty has drawn attention beyond the front: some seek explanations for Moscow’s defeat, others try to understand the new power along Siberia’s railways.\n\nAttention does not mean recognition or friendship. Our neighbours will choose their own responses. Tuva will now be judged not only by how it fights, but by how it governs."
 tt_postwar.6.a: "Let them see a state, not only an army."
 TT_postwar_neighbour_dialogue: "Dialogue after Taishet"
 TT_postwar_neighbour_caution: "Caution after Taishet"
